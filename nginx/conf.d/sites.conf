# ============================================================
# HTTP -> HTTPS redirect + ACME challenge (all hosts)
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# API (Django) — api.zedpaala.site
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.zedpaala.site;

    ssl_certificate     /etc/letsencrypt/live/zedpaala.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zedpaala.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://olap_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ============================================================
# Web app (Next.js) — app.zedpaala.site
# ============================================================
server {
    listen 443 ssl http2;
    server_name app.zedpaala.site;

    ssl_certificate     /etc/letsencrypt/live/zedpaala.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zedpaala.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://olap_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /_next/static/ {
        proxy_pass http://olap_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ============================================================
# Company website — zedpaala.site / www
# ============================================================
server {
    listen 443 ssl http2;
    server_name zedpaala.site www.zedpaala.site;

    ssl_certificate     /etc/letsencrypt/live/zedpaala.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zedpaala.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://comp_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
