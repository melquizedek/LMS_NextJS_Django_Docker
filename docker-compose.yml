x-common-config: &common-config
  env_file:
    - .env
  networks:
    - app_network
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  company_website:
    <<: *common-config
    container_name: company_website
    build:
      context: ./company_website
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./company_website/src:/app/src
      - ./company_website/app:/app/app
      - /app/.next

  olap_web_app:
    <<: *common-config
    container_name: olap_web_app
    build:
      context: ./olap_web_app
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    depends_on:
      olap_backend_api:
          condition: service_healthy
    volumes:
      - ./olap_web_app/src:/app/src
      - ./olap_web_app/app:/app/app
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  olap_db:
    <<: *common-config
    container_name: olap_db
    image: postgres:15-alpine
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  olap_redis:
    <<: *common-config
    container_name: olap_redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  olap_backend_api:
    <<: *common-config
    container_name: olap_backend_api
    build:
      context: ./olap_backend_api
      dockerfile: Dockerfile.dev
    image: olap_backend_api  # image name can be reused by other services
    ports:
      - "8000:8000"
    depends_on:
      olap_db:
        condition: service_healthy
      olap_redis:
        condition: service_healthy
    volumes:
      - ./olap_backend_api:/app
      - static_volume:/app/static
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  olap_backend_celery:
    <<: *common-config
    container_name: olap_backend_celery
    build:
      context: ./olap_backend_api
      dockerfile: Dockerfile.dev
    image: olap_backend_api  # Reusing the same image from olap_backend_api
    command: celery -A config.celery worker -l info
    volumes:
      - ./olap_backend_api:/app
      - static_volume:/app/static
      - backend_media:/app/media
    depends_on:
      olap_db:
        condition: service_healthy
      olap_redis:
        condition: service_healthy
      olap_backend_api:
        condition: service_started
    healthcheck:
      test: ["CMD", "celery", "-A", "config.celery", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  static_volume:
  backend_media:

networks:
  app_network:
    driver: bridge