# Standalone production compose file for the LMS stack.
# Deploy on the server with:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up --build -d
#
# This file is self-contained (does NOT merge with docker-compose.yml), so
# development-only source mounts and runtime overrides never leak into the
# production services. All three app tiers build from their Dockerfile.prod.
#
# --env-file .env.prod supplies the ${...} interpolations (build args, redis
# requirepass, postgres init). The env_file secrets reach the containers
# verbatim, so .env.prod must NOT contain ${...} inside a value.
#
# nginx terminates TLS (Let's Encrypt certs in ./letsencrypt) and is the only
# service exposed to the host (80/443). App services are internal-only.
# Store Postgres + Redis data in named volumes on the VM.
x-common-config: &common-config
  restart: unless-stopped
  networks: [app_network]
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  company_website:
    <<: *common-config
    image: company_website:v1.0
    container_name: company_website
    build:
      context: ./company_website
      dockerfile: Dockerfile.prod
      args:
        DJANGO_API_HOST: ${DJANGO_API_HOST:-https://api.zedpaala.site}
    env_file:
      - .env.prod
    environment:
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  olap_web_app:
    <<: *common-config
    image: olap_web_app:v1.0
    container_name: olap_web_app
    build:
      context: ./olap_web_app
      dockerfile: Dockerfile.prod
      args:
        DJANGO_API_HOST: ${DJANGO_API_HOST:-https://api.zedpaala.site}
    env_file:
      - .env.prod
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      olap_backend_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  olap_db:
    <<: *common-config
    image: postgres:15-alpine
    container_name: olap_db
    env_file:
      - .env.prod
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Explicit init env so the DB container doesn't rely on app env names.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  olap_redis:
    <<: *common-config
    image: redis:7-alpine
    container_name: olap_redis
    env_file:
      - .env.prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-defaultpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  olap_backend_api:
    <<: *common-config
    image: olap_backend_api:v1.0
    container_name: olap_backend_api
    build:
      context: ./olap_backend_api
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    depends_on:
      olap_db:
        condition: service_healthy
      olap_redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - backend_media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    <<: *common-config
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      company_website:
        condition: service_healthy
      olap_web_app:
        condition: service_healthy
      olap_backend_api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  backend_media:

networks:
  app_network:
    driver: bridge
