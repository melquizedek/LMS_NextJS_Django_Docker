[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:django]
command=python manage.py runserver 0.0.0.0:8000
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A config.celery worker -l info
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
